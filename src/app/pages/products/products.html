<section class="products-page">

  <aside class="products-page__sidebar">
    <nav class="category-nav" aria-label="Service categories">
      <ul class="category-nav__list">
        <li class="category-nav__item" *ngFor="let category of categories" [class.category-nav__item--active]="category.active">
          <a class="category-nav__link" href="javascript:void(0)">{{ category.name }}</a>
          <span class="category-nav__badge" *ngIf="category.hasBadge"></span>
        </li>
      </ul>
    </nav>

    <div class="price-filter">
      <h3 class="price-filter__title">GIÁ SẢN PHẨM</h3>
      <div class="price-filter__field">
        <label for="priceFrom" class="price-filter__label"><span class="price-filter__currency">đ</span> Từ</label>
        <input id="priceFrom" type="number" class="price-filter__input" [(ngModel)]="priceFrom" placeholder="0" />
      </div>
      <div class="price-filter__field">
        <label for="priceTo" class="price-filter__label"><span class="price-filter__currency">đ</span> Đến</label>
        <input id="priceTo" type="number" class="price-filter__input" [(ngModel)]="priceTo" placeholder="0" />
      </div>
      <button type="button" class="price-filter__apply-btn" (click)="applyPriceFilter()">Áp dụng</button>
    </div>
  </aside>

  <div class="products-page__content">
    <div class="products-grid">

      <article class="product-card" 
               *ngFor="let service of clinicServices" 
               (click)="goToProductDetail(service.id)"
               role="button" 
               style="position: relative; cursor: pointer;">

        <div class="product-card__image-wrapper" style="position: relative;">
          <img class="product-card__image" [src]="service.imageUrl" [alt]="service.name" loading="lazy" />
          
          <button
            type="button"
            class="product-card__favorite-btn"
            (click)="toggleFavorite(service, $event)"
            style="position: absolute; top: 10px; right: 10px; z-index: 2; border: none; background: transparent; cursor: pointer;"
          >
            <img
              class="product-card__favorite-icon"
              src="https://api.builder.io/api/v1/image/assets/TEMP/111f0b7def381004a52dd198195dc007863632f8?width=32"
              alt="Heart icon"
              [style.filter]="service.isFavorite ? 'none' : 'grayscale(100%)'"
              style="width: 24px; height: 24px; transition: filter 0.2s;"
            />
          </button>
        </div>

        <div class="product-card__price-row" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
          <span class="product-card__price" style="font-weight: 700; color: #E8627B;">{{ service.price | number }}đ</span>
          
          <span class="product-card__price-original" *ngIf="service.originalPrice && service.originalPrice > service.price">
            {{ service.originalPrice | number }}đ
          </span>

          <span class="product-card__discount-badge" *ngIf="service.discountPercent && service.discountPercent > 0">
            -{{ service.discountPercent }}%
          </span>
        </div>

        <h3 class="product-card__name">{{ service.name }}</h3>
        <p class="product-card__description">{{ service.description }}</p>

        <div class="product-card__meta-row" style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px;">
          <div class="product-card__rating-box" style="display: flex; align-items: center; gap: 4px;">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
              <path d="M9.49236 6.33333L7.63666 0L5.78095 6.33333H0L4.71945 9.82458L2.92484 15.8333L7.63666 12.1204L12.3561 15.8333L10.5615 9.82458L15.2733 6.33333H9.49236Z" fill="#FFCC00"/>
            </svg>
            <span class="product-card__rating">
              {{ service.rating ? service.rating.toFixed(1) : '5.0' }}
            </span>
          </div>
          <span class="product-card__sold-count">
            Đã bán {{ service.soldCount || 0 | number }}
          </span>
        </div>

      </article>

    </div>
  </div>
</section>
