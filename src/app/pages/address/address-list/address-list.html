<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="#">Trang chủ</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-current" aria-current="page">Sổ địa chỉ nhận hàng</span>
</nav>

<div class="account-page">

  <app-account-sidebar active="address"></app-account-sidebar>

  <!-- Nội dung phải -->
  <main class="account-content">
    <h2 class="section-title">Sổ địa chỉ nhận hàng</h2>

    <div class="address-list">
      <app-address-item
        *ngFor="let addr of addresses"
        [address]="addr"
        (edit)="openEditForm($event)"
        (delete)="requestDelete($event)"
      ></app-address-item>
    </div>

    <div class="add-address-row">
      <p class="add-address-text">Bạn muốn giao hàng đến địa chỉ khác?</p>
      <button type="button" class="btn-add-address" (click)="openAddForm()">
        Thêm địa chỉ mới
      </button>
    </div>
  </main>

</div>

<app-address-form
  *ngIf="showForm"
  [address]="editingAddress"
  (save)="saveAddress($event)"
  (close)="closeForm()"
></app-address-form>

<div class="confirm-overlay" *ngIf="pendingDeleteAddress" (click)="cancelDelete()">
  <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-delete-title" (click)="$event.stopPropagation()">
    <div class="confirm-header">
      <h3 id="confirm-delete-title" class="confirm-title">Xóa địa chỉ</h3>
      <button type="button" class="confirm-close" aria-label="Đóng" (click)="cancelDelete()">×</button>
    </div>
    <p class="confirm-text">Bạn có chắc chắn muốn xóa địa chỉ không?</p>
    <div class="confirm-actions">
      <button type="button" class="confirm-cancel" (click)="cancelDelete()">Hủy</button>
      <button type="button" class="confirm-confirm" (click)="confirmDelete()">Xác nhận</button>
    </div>
  </div>
</div>

<div class="toast" *ngIf="toastMessage" role="status" aria-live="polite">
  <span class="toast-icon" aria-hidden="true">
    <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
      <path d="M1 6L5.5 10.5L15 1" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
  <span class="toast-text">{{ toastMessage }}</span>
</div>
