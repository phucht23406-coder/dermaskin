<div class="address-form-overlay" (click)="close.emit()">
  <div class="frame" role="dialog" aria-modal="true" aria-labelledby="address-form-title" (click)="$event.stopPropagation()">
    <header class="frame-header">
      <h1 id="address-form-title" class="frame-title">{{ isEditing ? 'Sửa địa chỉ' : 'Thêm địa chỉ mới' }}</h1>
      <button class="btn-close" type="button" aria-label="Đóng" (click)="close.emit()">×</button>
    </header>

    <form (ngSubmit)="onSubmit()">
      <section class="form-row-2" aria-label="Thông tin người nhận">
        <label class="input-box" for="phone">
          <input
            class="input-field"
            id="phone"
            name="phone"
            type="tel"
            inputmode="tel"
            autocomplete="tel"
            placeholder="Số điện thoại"
            [(ngModel)]="model.phone"
            required
          />
        </label>
        <label class="input-box" for="fullname">
          <input
            class="input-field"
            id="fullname"
            name="fullname"
            type="text"
            autocomplete="name"
            placeholder="Họ và tên"
            [(ngModel)]="model.name"
            required
          />
        </label>
      </section>

      <label class="input-box input-box-full" for="district">
        <select
          class="input-field"
          id="district"
          name="district"
          required
          aria-label="Chọn Tỉnh hoặc Thành phố, Quận hoặc Huyện"
          [ngModel]="model.districtValue"
          (ngModelChange)="onDistrictChange($event)"
        >
          <option value="" disabled>Chọn Tỉnh/Thành phố, Quận/Huyện</option>
          <option *ngFor="let d of districtOptions" [value]="d.value">{{ d.label }}</option>
        </select>
      </label>

      <label class="input-box input-box-full" for="ward">
        <select
          class="input-field"
          id="ward"
          name="ward"
          required
          [disabled]="!model.districtValue"
          aria-label="Chọn Phường hoặc Xã"
          [(ngModel)]="model.ward"
        >
          <option value="" disabled>Chọn Phường/Xã</option>
          <option *ngFor="let w of wardOptions" [value]="w">{{ w }}</option>
        </select>
      </label>

      <label class="input-box input-box-full" for="address-detail">
        <textarea
          class="input-field"
          id="address-detail"
          name="addressDetail"
          rows="1"
          placeholder="Địa chỉ cụ thể (Số nhà, tên đường, tòa nhà,...)"
          [(ngModel)]="model.addressDetail"
          required
        ></textarea>
      </label>

      <div class="map-preview" aria-label="Bản đồ xem trước vị trí địa chỉ">
        <span>Bản đồ xem trước vị trí địa chỉ</span>
      </div>

      <fieldset class="type-group">
        <legend class="type-legend">Chọn loại địa chỉ</legend>
        <label class="type-pill" [class.active]="model.type === 'home'">
          <input type="radio" name="address-type" value="home" [(ngModel)]="model.type" />
          <span>Nhà riêng</span>
        </label>
        <label class="type-pill" [class.active]="model.type === 'company'">
          <input type="radio" name="address-type" value="company" [(ngModel)]="model.type" />
          <span>Công ty</span>
        </label>
      </fieldset>

      <hr class="divider" />

      <div class="default-row">
        <label class="default-label" for="default-address">Đặt làm địa chỉ mặc định</label>
        <label class="toggle">
          <input
            id="default-address"
            type="checkbox"
            name="isDefault"
            aria-label="Đặt làm địa chỉ mặc định"
            [(ngModel)]="model.isDefault"
          />
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </div>

      <div class="form-footer">
        <button class="btn-cancel" type="button" (click)="close.emit()">Hủy</button>
        <button class="btn-submit" type="submit">Tiếp tục</button>
      </div>
    </form>
  </div>
</div>
