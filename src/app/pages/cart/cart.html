<app-header></app-header>
<main class="cart-page">

    <div class="container">

        <!-- Breadcrumb -->

        <nav class="breadcrumb">
            <a href="#">Trang chủ</a>
            <span>/</span>
            <span>Giỏ hàng</span>
        </nav>

        <div class="cart-wrapper">

            <!-- Danh sách sản phẩm -->

            <section class="cart-list">

                <div class="cart-title">

                    <h2>Sản phẩm</h2>

                    <h2>Giá tiền</h2>

                    <h2>Thành tiền</h2>

                </div>

                <div class="cart-item">

                    <div class="product">

                        <img
                            src="https://api.builder.io/api/v1/image/assets/TEMP/ff8bb16d3794ba9d5df8808ff8236df8692fde35?width=260"
                            alt="Bộ làm sạch da"
                        >

                        <div class="product-info">

                            <h3>Bộ làm sạch da</h3>

                            <p>Bộ 3 sản phẩm</p>

                        </div>

                    </div>

                    <div class="price">

                        <span class="money">
                            600.000 đ
                        </span>

                        <span class="qty">
                            SL: 1
                        </span>

                    </div>

                    <div class="total">

                        600.000 đ

                    </div>

                </div>

            </section>
                        <!-- Hóa đơn -->

            <aside class="cart-summary">

                <h2>Hóa đơn của bạn</h2>

                <div class="summary-item">
                    <span>Tạm tính:</span>
                    <span>1.000.000 đ</span>
                </div>

                <div class="summary-item">
                    <span>Giảm giá:</span>
                    <span>0 đ</span>
                </div>

                <hr>

                <div class="summary-item total">

                    <span>Tổng cộng:</span>

                    <span>1.000.000 đ</span>

                </div>

                <button class="checkout-btn">
                    Đặt hàng
                </button>

            </aside>

        </div>

    </div>
<app-footer></app-footer>
