<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="#">Trang chủ</a>
  <span class="breadcrumb-sep">›</span>
  <span class="breadcrumb-current" aria-current="page">Voucher của tôi</span>
</nav>

<div class="account-page">

  <app-account-sidebar active="voucher"></app-account-sidebar>

  <!-- Nội dung phải -->
  <main class="account-content">
    <h2 class="section-title">Danh sách voucher của bạn</h2>

    <!-- Trạng thái trống -->
    <div class="empty-state" *ngIf="vouchers.length === 0">
      <div class="voucher-icon">
        <svg width="80" height="60" viewBox="0 0 80 60" fill="none">
          <rect x="2" y="10" width="76" height="40" rx="6" stroke="#333" stroke-width="2.5" fill="none"/>
          <circle cx="2" cy="30" r="6" fill="#fff7f7" stroke="#333" stroke-width="2.5"/>
          <circle cx="78" cy="30" r="6" fill="#fff7f7" stroke="#333" stroke-width="2.5"/>
          <line x1="20" y1="10" x2="20" y2="50" stroke="#333" stroke-width="2" stroke-dasharray="4 3"/>
          <text x="42" y="35" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">%</text>
        </svg>
      </div>
      <p class="empty-text">Ví voucher của bạn đang trống</p>
    </div>

    <!-- Danh sách voucher -->
    <div class="voucher-grid" *ngIf="vouchers.length > 0">
      <article class="voucher-card" *ngFor="let v of vouchers">
        <header class="voucher-card-header">
          <p class="voucher-title">{{ v.title }}</p>
          <span class="voucher-badge-new" *ngIf="v.isNew">Mới</span>
        </header>

        <div class="voucher-body">
          <img class="voucher-logo" [src]="v.logo" [alt]="v.logoAlt" />
          <div class="voucher-info">
            <p class="voucher-discount">{{ v.discount }}</p>
            <p class="voucher-min-order">{{ v.minOrder }}</p>
          </div>
        </div>

        <hr class="voucher-divider" />

        <p class="voucher-expiry">
          Có giá trị cho đến {{ v.expiryDate }}<span class="voucher-expiry-time">{{ v.expiryTime }}</span>
        </p>
      </article>
    </div>

    <!-- Banner thêm voucher -->
    <div class="voucher-more-banner" *ngIf="vouchers.length > 0">
      <p class="voucher-more-text">Bạn muốn có thêm voucher?</p>
      <div class="voucher-more-actions">
        <button type="button" class="btn-voucher-action">
          <svg class="voucher-action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="12" rx="2" />
            <path d="M3 10h18" />
          </svg>
          Nhập mã voucher
        </button>
        <button type="button" class="btn-voucher-action">
          <svg class="voucher-action-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 9V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v2a2 2 0 0 1 0 4v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2a2 2 0 0 1 0-4Z" />
            <path d="M10 8v8" stroke-dasharray="2 2" />
          </svg>
          Tìm thêm voucher
        </button>
      </div>
    </div>
  </main>

</div>
