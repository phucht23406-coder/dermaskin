<div class="account-page">

  <!-- Sidebar trái -->
  <aside class="sidebar">
    <div class="user-info">
      <img src="assets/avatar-placeholder.png" alt="avatar" class="avatar" />
      <div>
        <p class="greeting">Chào Nguyễn An</p>
        <a href="#" class="edit-link">Chỉnh sửa tài khoản</a>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active">Thông tin tài khoản</a>
      <a href="#" class="nav-item">Đơn hàng của tôi</a>
      <a href="#" class="nav-item">Sản phẩm yêu thích</a>
      <a href="#" class="nav-item">Voucher của tôi</a>
      <a href="#" class="nav-item">Lịch hẹn dịch vụ</a>
      <a href="#" class="nav-item">Đăng xuất</a>
    </nav>
  </aside>

  <!-- Nội dung phải -->
  <main class="account-content">
    <h2 class="section-title">Thông tin tài khoản</h2>
    <div class="form-with-avatar">
      <img src="assets/avatar-placeholder.png" alt="avatar" class="form-avatar" />
      <form class="account-form">
        <div class="form-row">
          <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" placeholder="Nhập tên đăng nhập" />
          </div>
          <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" placeholder="Nhập họ và tên" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Email&#64;gmail.com" />
          </div>
          <div class="form-group">
            <label>Tỉnh / Tp</label>
            <input type="text" placeholder="Tỉnh/thành" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" placeholder="(84) ***.***.***" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Giới tính</label>
            <select>
              <option>Nữ</option>
              <option>Nam</option>
            </select>
          </div>
          <div class="form-group">
            <label>Ngày sinh</label>
            <div class="dob-row">
              <select><option>01</option></select>
              <select><option>01</option></select>
              <select><option>2000</option></select>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-save">Lưu thay đổi</button>
        </div>
      </form>
    </div>
  </main>

</div>
